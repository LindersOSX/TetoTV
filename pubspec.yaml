name: anime_tv
description: A TV-first anime tracking and playback client.
publish_to: 'none'
# Reserve 10,000 version-code values per public release. Flutter adds an
# ABI-specific offset to split APKs, so the next universal APK must still be
# newer than every split APK from the previous release.
version: 1.11.1+80001

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  flutter_vlc_player: 7.4.4
  go_router: ^17.3.0
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_video: ^2.0.1
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  # Local compatibility patch: the Android library exports QuickJS's standard
  # JS_SetMemoryLimit symbol while flutter_js 0.8.7 only looks for a lowercase
  # wrapper name. Keeping the patched package in-tree makes release builds
  # reproducible and preserves the addon sandbox memory limit.
  flutter_js:
    path: third_party/flutter_js

# flutter_vlc_player 7.4.4 was published with Android Pigeon channels from its
# release tag but pub.dev's platform-interface archive contains the older
# channel names. Pin the matching official tag source so Dart and Android use
# the same generated protocol.
dependency_overrides:
  flutter_vlc_player_platform_interface:
    git:
      url: https://github.com/solid-software/flutter_vlc_player.git
      ref: 988a7e67140786fb5510c96e4cb415dbfd837944
      path: flutter_vlc_player_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/branding/tetotv_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/tetotv_icon.png"
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tetotv_icon.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/typescript/sucrase.js
    - assets/typescript/SUCRASE_LICENSE.txt
    - assets/addon_runtime/linkedom.js
    - assets/addon_runtime/LINKEDOM_LICENSE.txt
    - assets/addon_runtime/CRYPTO_JS_LICENSE.txt
    - assets/subtitles/libass_smoke.ass
    - assets/videos/vlc_smoke.mp4
