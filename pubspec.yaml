name: anime_tv
description: A TV-first anime tracking and playback client.
publish_to: 'none'
version: 1.5.2+30002

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_video: ^2.0.1
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/branding/tetotv_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/tetotv_icon.png"
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tetotv_icon.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/subtitles/libass_smoke.ass
