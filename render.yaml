services:
  - type: web
    name: tetotv-auth
    runtime: node
    plan: free
    rootDir: broker
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANILIST_CLIENT_ID
        sync: false
      - key: ANILIST_CLIENT_SECRET
        sync: false
      - key: MAL_CLIENT_ID
        sync: false
      - key: MAL_CLIENT_SECRET
        sync: false
